[build-system]
requires = ["uv_build>=0.7.19,<0.10"]
build-backend = "uv_build"

[project]
name = "vekn-forum-bridge"
version = "0.1.0"
description = "archon login bridge for the VEKN Discourse sites"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "itsdangerous>=2",
    "psycopg>=3.2",
    "python-multipart>=0.0.9",
    "uvicorn>=0.34",
]

[project.scripts]
vekn-bridge-sweep = "bridge.sweep:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio", "ruff", "ty"]
deploy = ["server-setup"]

[tool.uv.sources]
server-setup = { git = "https://github.com/lionel-panhaleux/server-setup", tag = "v2.0.0" }

[tool.uv.build-backend]
module-name = "bridge"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
addopts = "-vv --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
